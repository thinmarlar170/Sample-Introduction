<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A short introduction to Mar Lar, a student who enjoys reading.">
  <title>Mar Lar | Introduction</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20342c;
      --muted: #52635a;
      --paper: #fbf8ef;
      --green: #376b52;
      --coral: #c65e43;
      --yellow: #f0c66c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background-color: var(--paper);
      background-image: radial-gradient(#d9dfcf 0.8px, transparent 0.8px);
      background-size: 19px 19px;
      color: var(--ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    main {
      width: min(100% - 2rem, 760px);
      margin: 0 auto;
      padding: clamp(3rem, 10vw, 7rem) 0;
    }

    .intro {
      position: relative;
      padding: clamp(1.5rem, 6vw, 3.5rem);
      border-left: 6px solid var(--green);
      background: rgba(255, 255, 255, 0.78);
    }

    .eyebrow {
      margin: 0 0 0.8rem;
      color: var(--coral);
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2.8rem, 11vw, 5.5rem);
      font-weight: 500;
      line-height: 1;
    }

    .summary {
      max-width: 34rem;
      margin: 1.5rem 0 0;
      color: var(--muted);
      font-size: clamp(1.1rem, 4vw, 1.35rem);
      line-height: 1.7;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem 2rem;
      margin-top: 2.5rem;
    }

    .detail {
      padding-top: 1rem;
      border-top: 2px solid var(--yellow);
    }

    h2 {
      margin: 0 0 0.55rem;
      color: var(--green);
      font-family: Arial, sans-serif;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .detail p {
      margin: 0;
      font-size: 1.15rem;
      line-height: 1.5;
    }

    blockquote {
      margin: 2.5rem 0 0;
      padding: 1rem 0 0 1.25rem;
      border-left: 3px solid var(--coral);
      color: var(--ink);
      font-size: clamp(1.3rem, 5vw, 1.8rem);
      font-style: italic;
      line-height: 1.4;
    }

    @media (max-width: 520px) {
      .details {
        grid-template-columns: 1fr;
        gap: 1.25rem;
      }
    }
  </style>
</head>
<body>
  <main>
    <article class="intro" aria-labelledby="page-title">
      <p class="eyebrow">A little about me</p>
      <h1 id="page-title">Mar Lar</h1>
      <p class="summary">I am a student of KIC. I enjoy reading and learning new things.</p>

      <div class="details">
        <section class="detail" aria-labelledby="studies-title">
          <h2 id="studies-title">Studies</h2>
          <p>Student at KIC</p>
        </section>
        <section class="detail" aria-labelledby="interests-title">
          <h2 id="interests-title">Interests</h2>
          <p>Reading</p>
        </section>
      </div>

      <blockquote>"Benevolence Above All Else"</blockquote>
    </article>
  </main>
</body>
</html>
